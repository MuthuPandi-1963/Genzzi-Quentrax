services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: root
      POSTGRES_DB: genzzi-quiz
    ports:
      - "4000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    restart: always
    command: [
      "redis-server",
      "/usr/local/etc/redis/redis.conf",
      "--requirepass", "root"
    ] 
    ports:
      - "4005:6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    # ✅ Removing environment for password (Redis doesn't read it without override)

volumes:
  postgres_data:
  redis_data:
